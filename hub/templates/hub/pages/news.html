<div class="container page-heading">{% include 'hub/partials/breadcrumbs.html' %}<p class="eyebrow">{% if lang == 'fr' %}Le fil du projet{% else %}Project journal{% endif %}</p><h1>{{ labels.news }}</h1></div>
<section class="container content-section"><form class="filter-form" method="get"><div class="filter-field"><label for="sector-filter">{{ labels.sectors }}</label><select id="sector-filter" name="secteur"><option value="">{{ labels.all }}</option>{% for sector in secteurs %}<option value="{{ sector.slug }}" {% if selected_slug == sector.slug %}selected{% endif %}>{{ sector.nom }}</option>{% endfor %}</select></div><button class="button" type="submit">{{ labels.filter }} <span aria-hidden="true">→</span></button></form>{% include 'hub/partials/news_list.html' %}</section>
