{% if projets_en_cours %}<section class="container content-section" data-current-project aria-labelledby="current-project-title"><div class="section-heading"><h2 id="current-project-title">{{ labels.current_project }}</h2></div><div class="sector-grid">{% for projet in projets_en_cours %}<article class="sector-card"><div class="card-top"><span class="status">{{ projet.statut }}</span></div><h3><a href="{{ projet.url }}">{{ projet.titre }}</a></h3><p>{{ projet.resume|linebreaksbr }}</p></article>{% endfor %}</div></section>{% endif %}
